# Публікація гри на GitHub Pages.
#
# Джерела — TypeScript, тож тут є білд: tsc кладе ES-модулі в dist/, і саме вони
# їдуть у Pages разом із index.html, lib/ (вендорений pixi, який dist/ фетчить
# у рантаймі) і data/. Самі .ts за межі репо не виходять.
#
# tools/ лишається в репо, але не на хостингу: там живе селфчек і проксі до
# Gemini, і їхнє місце — лише на машині розробника.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Деплой один за раз; проміжні пуші не мають ганяти зайві білди.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true вмикає Pages сам, якщо їх ще не вмикали руками.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc із noEmitOnError: якщо типи не сходяться, деплою не буде.
      - name: Зібрати статику гри
        run: |
          npm run build
          mkdir -p _site
          cp -r index.html dist lib data _site/
          touch _site/.nojekyll   # інакше Jekyll лізе обробляти те, що обробляти не треба

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
