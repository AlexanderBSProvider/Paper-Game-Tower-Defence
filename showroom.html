<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Шоурум ворогів — Monster Horde</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#1b1917; }
  body { -webkit-user-select:none; user-select:none; touch-action:manipulation;
    font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive; color:#2b3a8f; }
  #app canvas { display:block; position:fixed; inset:0; }
  #ui { position:fixed; inset:0; display:flex; flex-direction:column; padding:10px 14px 12px; box-sizing:border-box; gap:8px; }
  header { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  h1 { font-size:clamp(18px,3.4vh,26px); margin:0 8px 0 0; }
  .tab, .btn, .go { font:inherit; color:#2b3a8f; background:#fffdf6; border:1.5px solid #8f8875; border-radius:4px;
    padding:4px 12px; cursor:pointer; box-shadow:2px 3px 0 rgba(42,36,24,.15); font-size:clamp(13px,2.2vh,16px); }
  .tab.on { border-color:#2b3a8f; background:#fff3b0; font-weight:700; }
  .go { border-color:#2b3a8f; background:#fff3b0; font-weight:700; text-decoration:none; }
  .spacer { flex:1; }
  #hint { font-size:clamp(12px,2vh,15px); color:#5a5a5a; }
  #summary { font-size:clamp(12px,2vh,15px); color:#2e7d5b; }
  #grid { flex:1; min-height:0; display:grid; gap:10px;
    grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); grid-auto-rows:minmax(0,1fr); }
  /* Картки без заливки: DOM лежить над канвасом, і будь-який фон тонував би істоту. */
  .card { position:relative; display:flex; flex-direction:column; border:1.5px dashed #8f8875; border-radius:6px; min-height:150px; }
  .card.picked { border:3px solid #2b3a8f; }
  .card.picked .foot { background:rgba(255,224,102,.55); }
  .stage { flex:1; cursor:pointer; }
  .foot { display:flex; align-items:center; gap:6px; padding:6px 8px; border-top:1px dashed #8f8875; }
  .name { flex:1; font-weight:700; font-size:clamp(14px,2.4vh,18px); }
  .btn { padding:2px 8px; }
  .btn.pick { border-color:#2b3a8f; }
  .card.picked .btn.pick { background:#fff3b0; font-weight:700; }
</style>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <header>
    <h1>Шоурум ворогів</h1>
    <div id="tabs"></div>
    <span class="spacer"></span>
    <button class="btn" id="walk">Крокують</button>
    <button class="btn" id="reset">Скинути вибір</button>
    <a class="go" href="./?mode=lane&page=4">Грати з обраними ▶</a>
    <a class="go" href="./?mode=lane&page=5">До боса ▶</a>
  </header>
  <div id="hint"></div>
  <div id="grid"></div>
  <div id="summary"></div>
</div>
<script type="module" src="./dist/showroom.js"></script>
</body>
</html>
