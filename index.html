<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Monster Horde</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#1b1917; }
  body { touch-action:none; -webkit-tap-highlight-color:transparent; }
  #app canvas { display:block; }


  /* Полиця трафаретів ліворуч від рамки обведення: DOM, бо перо літер не вміє. */
  #shelf {
    position:fixed; z-index:9; display:flex; flex-direction:column; gap:5px;
    overflow-y:auto; box-sizing:border-box; padding:4px;
    background:rgba(246,242,231,0.92); border:1.5px solid #5a5a5a;
    box-shadow:4px 5px 0 rgba(42,36,24,0.22);
    font:12px/1.2 "Segoe Print","Bradley Hand","Comic Sans MS",cursive; color:#2b3a8f;
    scrollbar-width:thin;
  }
  #shelf[hidden] { display:none; }
  #shelf .card {
    display:flex; align-items:center; gap:6px; width:100%; text-align:left;
    background:#f6f2e7; color:#2b3a8f; border:1.5px solid #8f8875; border-radius:3px;
    padding:4px 6px; cursor:pointer; font:inherit; touch-action:manipulation;
  }
  #shelf .card svg { width:40px; height:40px; flex:none; color:#2b3a8f; }
  #shelf .card .txt { flex:1; min-width:0; }
  #shelf .card .title { font-weight:600; font-size:13px; }
  #shelf .card .hint { color:#5a5a5a; font-size:11px; }
  #shelf .card .cost { flex:none; color:#2e7d5b; font-weight:600; font-size:14px; }
  #shelf .card.picked { border-color:#2b3a8f; box-shadow:inset 0 0 0 3px #ffe066; background:#fff9d6; }
  #shelf .card.locked { opacity:0.45; cursor:default; }
  #shelf .card.locked svg { color:#5a5a5a; }
  #shelf .card.poor .cost { color:#5a5a5a; text-decoration:line-through; }
  #shelf .card.poor:not(.locked) { opacity:0.7; }
  #shelf .shelf-gap { height:1px; background:#8f8875; margin:2px 8px; flex:none; }
  #shelf .shelf-head { flex:none; font-size:11px; color:#5a5a5a; padding:2px 4px 4px; border-bottom:1px dashed #8f8875; }
  #shelf .card .hint.when { color:#c0392b; }
  #shelf .card.locked .cost { visibility:hidden; }
  @media (max-height: 480px) {
    #shelf .card .hint { display:none; }
    #shelf .card svg { width:28px; height:28px; }
    #shelf .card { padding:2px 5px; }
  }
  /* Кампанія: банер, записка кінця сторінки, зошит, кнопка меню (laneUi.ts). */
  #lane-ui { position:fixed; inset:0; pointer-events:none; z-index:12;
    font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive; color:#2b3a8f; }
  #lane-ui .banner { position:absolute; left:50%; top:22%; transform:translate(-50%,-10px) rotate(-2deg);
    text-align:center; opacity:0; transition:opacity .25s, transform .25s; white-space:nowrap; }
  #lane-ui .banner.show { opacity:1; transform:translate(-50%,0) rotate(-2deg); }
  #lane-ui .b-main { display:inline-block; font-size:clamp(26px,6vh,52px); font-weight:700; color:#2b3a8f;
    padding:0 .35em; background:linear-gradient(transparent 55%, rgba(255,224,102,.85) 55%, rgba(255,224,102,.85) 90%, transparent 90%); }
  #lane-ui .b-sub { font-size:clamp(13px,2.6vh,20px); color:#5a5a5a; margin-top:4px; }
  #lane-ui .veil { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(42,36,24,.35); pointer-events:auto; padding:12px; box-sizing:border-box; }
  #lane-ui .veil[hidden] { display:none; }
  #lane-ui .note { background:#f6f2e7; border:1.5px solid #5a5a5a; box-shadow:4px 5px 0 rgba(42,36,24,.22);
    padding:16px 22px 18px; max-width:min(560px,94vw); max-height:92vh; overflow:auto; box-sizing:border-box;
    background-image:linear-gradient(rgba(167,186,214,.35) 1px, transparent 1px); background-size:100% 23px;
    transform:rotate(-.6deg); animation:note-in .28s ease-out; }
  @keyframes note-in { from { transform:translateY(18px) rotate(-.6deg); opacity:0; } }
  #lane-ui h1 { font-size:clamp(20px,4.4vh,30px); margin:0 0 6px; text-align:center; }
  #lane-ui .note.win h1 { color:#2e7d5b; }
  #lane-ui .note.lose h1 { color:#c0392b; }
  #lane-ui .note p { margin:4px 0; text-align:center; font-size:clamp(13px,2.5vh,17px); color:#2b3a8f; }
  #lane-ui .stars { text-align:center; font-size:clamp(30px,7vh,52px); line-height:1; margin:2px 0 6px; letter-spacing:4px; }
  #lane-ui .star { color:#b9b3a3; display:inline-block; }
  #lane-ui .star.on { color:#e0761a; animation:star-pop .45s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes star-pop { from { transform:scale(0) rotate(-40deg); opacity:0; } }
  #lane-ui .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
  #lane-ui .btn { font:inherit; font-size:clamp(14px,2.7vh,19px); color:#2b3a8f; background:#fffdf6;
    border:1.5px solid #5a5a5a; border-radius:4px; padding:6px 16px; cursor:pointer; touch-action:manipulation;
    box-shadow:2px 3px 0 rgba(42,36,24,.18); }
  #lane-ui .btn.primary { border-color:#2b3a8f; background:#fff3b0; font-weight:700; }
  #lane-ui .btn:active { transform:translateY(2px); box-shadow:none; }
  #lane-ui .pages { width:min(560px,94vw); }
  #lane-ui .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; }
  #lane-ui .page { font:inherit; color:#2b3a8f; background:#fffdf6; border:1.5px solid #8f8875; border-radius:3px;
    padding:6px 4px 4px; cursor:pointer; touch-action:manipulation; display:flex; flex-direction:column; align-items:center; gap:2px; }
  #lane-ui .page .num { font-size:22px; font-weight:700; line-height:1; }
  #lane-ui .page .ttl { font-size:11px; color:#5a5a5a; min-height:2.4em; text-align:center; line-height:1.2; }
  #lane-ui .page .stars { font-size:16px; margin:0; letter-spacing:1px; }
  #lane-ui .page .star.on { animation:none; }
  #lane-ui .page.locked { opacity:.45; cursor:default; }
  #lane-ui .page.endless { background:#fff3b0; border-color:#2b3a8f; }
  #lane-ui .page.endless.locked { background:#fffdf6; }
  #lane-ui .menu-btn { position:absolute; top:8px; right:8px; pointer-events:auto; font:inherit; font-size:20px;
    width:40px; height:40px; color:#2b3a8f; background:rgba(246,242,231,.9); border:1.5px solid #8f8875;
    border-radius:4px; cursor:pointer; touch-action:manipulation; }
  #lane-ui .menu-btn[hidden] { display:none; }
  #lane-ui .dev-badge { position:absolute; left:8px; bottom:6px; padding:2px 8px; font-size:12px; color:#c0392b;
    background:rgba(255,224,102,.85); border:1.5px dashed #c0392b; border-radius:3px; }
  #lane-ui .dev-badge[hidden] { display:none; }
  /* Навчання: бульбашка зі стрілкою біля того, куди тапати. Дотиків не забирає. */
  #lane-ui .coach { position:absolute; max-width:min(260px,40vw); padding:7px 11px; font-size:clamp(13px,2.6vh,17px);
    line-height:1.25; color:#2b3a8f; background:#fffdf6; border:2px solid #2b3a8f; border-radius:6px;
    box-shadow:3px 4px 0 rgba(42,36,24,.2); pointer-events:none; animation:coach-bob 1.1s ease-in-out infinite; }
  #lane-ui .coach[hidden] { display:none; }
  #lane-ui .coach::after { content:''; position:absolute; width:0; height:0; border:9px solid transparent; }
  #lane-ui .coach.right { transform:translate(22px,-50%); }
  #lane-ui .coach.right::after { left:-20px; top:50%; margin-top:-9px; border-right-color:#2b3a8f; }
  #lane-ui .coach.above { transform:translate(-50%, calc(-100% - 22px)); }
  #lane-ui .coach.above::after { left:50%; bottom:-20px; margin-left:-9px; border-top-color:#2b3a8f; }
  #lane-ui .coach.below { transform:translate(-50%, 22px); }
  #lane-ui .coach.below::after { left:50%; top:-20px; margin-left:-9px; border-bottom-color:#2b3a8f; }
  @keyframes coach-bob { 50% { margin-left:5px; } }
  #lane-ui .coach.above, #lane-ui .coach.below { animation-name:coach-bob-v; }
  @keyframes coach-bob-v { 50% { margin-top:-5px; } }
  /* Платформи просять, щоб подвійний тап і довге натискання не виділяли гру. */
  body { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
</style>
<!--
  Платформний SDK підключається одним тегом; src/sdk.js сам визначає, який завантажено.
  Poki:        <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
  CrazyGames:  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  Поки не підключено — шим працює в no-op режимі, зовнішніх запитів нуль.
-->
</head>
<body>
<div id="app"></div>
<script type="module" src="./dist/main.js"></script>
</body>
</html>
